appId: dev.ollupi.desktop
productName: Ollupi
copyright: Copyright © 2026 0xfakeSpike
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  # The sidecar built for the arch being packaged (pnpm sidecar:release).
  - from: resources/bin/${arch}
    to: bin
mac:
  category: public.app-category.developer-tools
  minimumSystemVersion: '12.0'
  # The dmg is for a first install; the app updates itself from the zip,
  # which latest-mac.yml lists with its sha512 (src/main/update.ts).
  target: [dmg, zip]
  artifactName: ${productName}-${version}-${arch}.${ext}
  # No Developer ID yet: sign ad hoc, so Apple silicon runs the bundle once
  # the user lets Gatekeeper open it. Hardened runtime needs a real identity.
  identity: '-'
  hardenedRuntime: false
# Gives the release latest-mac.yml, which the app's updater reads from the
# latest GitHub release. Releases are uploaded by hand (--publish never).
publish:
  provider: github
  owner: 0xfakeSpike
  repo: ollupi-desktop
dmg:
  title: ${productName} ${version}
