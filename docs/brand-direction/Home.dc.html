<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>官网首屏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Noto+Sans+SC:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#AEB5F5}a:hover{color:#EFF0FB}
</style>
</helmet>
<div style="width: 1440px; height: 1560px; box-sizing: border-box; background: #F5F5F8; color: #17161F; font-family: Inter, 'PingFang SC', sans-serif; display: flex; flex-direction: column; align-items: center; overflow: hidden;">

  <div style="width: 100%; height: 760px; flex-shrink: 0; background: #1B1838; display: flex; flex-direction: column; align-items: center;">
    <header style="width: 100%; max-width: 1200px; height: 72px; display: flex; align-items: center; gap: 32px;">
      <a href="#" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
        <dc-import name="Pup" face="smile" cell="1.4" hint-size="28px,28px"></dc-import>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 700; color: #EFF0FB; letter-spacing: -0.035em;">ollupi</span>
      </a>
      <nav aria-label="Main" style="display: flex; gap: 24px; font-size: 14px; margin-left: auto;">
        <a href="#" style="text-decoration: none;">文档</a>
        <a href="#" style="text-decoration: none;">更新日志</a>
        <a href="#" style="text-decoration: none;">GitHub</a>
      </nav>
      <a href="#" style="height: 36px; display: flex; align-items: center; padding: 0 16px; border-radius: 8px; background: #EFF0FB; color: #1B1838; text-decoration: none; font-size: 14px; font-weight: 600;">下载</a>
    </header>

    <section style="display: flex; align-items: center; gap: 56px; padding-top: 88px;">
      <dc-import name="Pup" animate="blink" cell="10" hint-size="200px,200px"></dc-import>
      <div style="display: flex; flex-direction: column; gap: 20px;">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Noto Sans SC', sans-serif; font-size: 72px; line-height: 80px; font-weight: 800; color: #EFF0FB; letter-spacing: -0.02em;">一只住在你 Mac 里、<br>会干活的像素小狼。</h1>
        <p style="margin: 0; max-width: 600px; font-size: 18px; line-height: 30px; color: #C9CCF2;">它在你的项目里读文件、跑命令、记住你的习惯；要动重要的东西时，会停下来看着你，等你点头。</p>
        <div style="display: flex; align-items: center; gap: 12px; margin-top: 4px;">
          <a href="#" style="height: 48px; display: flex; align-items: center; padding: 0 24px; border-radius: 10px; background: #EFF0FB; color: #1B1838; text-decoration: none; font-size: 15px; font-weight: 600;">下载 macOS 版</a>
          <a href="#" style="height: 48px; display: flex; align-items: center; padding: 0 24px; border-radius: 10px; border: 1px solid rgba(239,240,251,0.28); color: #EFF0FB; text-decoration: none; font-size: 15px; font-weight: 500;">GitHub</a>
          <span style="font-size: 13px; color: #84839A; margin-left: 8px;">适用于 Apple 芯片 · <span style="font-family: 'JetBrains Mono', monospace;">[读音]</span> · [名字的来历]</span>
        </div>
      </div>
    </section>
  </div>

  <div style="margin-top: -200px; width: 1152px; height: 720px; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(27,24,56,0.1), 0 32px 80px rgba(27,24,56,0.35); flex-shrink: 0;">
    <div style="width: 1440px; height: 900px; transform: scale(0.8); transform-origin: top left;">
      <dc-import name="Screen" mode="light" hint-size="1440px,900px"></dc-import>
    </div>
  </div>

  <div style="width: 1152px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: 80px;">
    <div style="background: #FFFFFF; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px;">
      <dc-import name="Pup" animate="think" cell="2.4" hint-size="48px,48px"></dc-import>
      <span style="font-family: 'Noto Sans SC', sans-serif; font-size: 22px; font-weight: 900; color: #1B1838;">在你的项目里干活</span>
      <span style="font-size: 15px; line-height: 24px; color: #52515F;">打开一个文件夹，它就在那里读、写、跑命令，用的是你本机的工具。</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px;">
      <dc-import name="Pup" face="oh" cell="2.4" hint-size="48px,48px"></dc-import>
      <span style="font-family: 'Noto Sans SC', sans-serif; font-size: 22px; font-weight: 900; color: #1B1838;">该问的时候会停</span>
      <span style="font-size: 15px; line-height: 24px; color: #52515F;">危险的命令、拿不准的选择，它会停下来看着你，等你批准或回答。</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px;">
      <dc-import name="Pup" face="wink" cell="2.4" hint-size="48px,48px"></dc-import>
      <span style="font-family: 'Noto Sans SC', sans-serif; font-size: 22px; font-weight: 900; color: #1B1838;">记得你</span>
      <span style="font-size: 15px; line-height: 24px; color: #52515F;">你的偏好和项目的约定会被记下来，下次不用再说一遍。你随时可以查看和删掉。</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1560}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
