<script type="application/json" id="canvas">{"title":"Ollupi 设计语言方向稿","boards":[{"file":"Main.dc.html","x":0,"y":0,"w":1440,"h":960,"title":"01 格墨：方向"},{"file":"Color.dc.html","x":1520,"y":0,"w":1440,"h":960,"title":"02 颜色"},{"file":"Type.dc.html","x":0,"y":1080,"w":1440,"h":1000,"title":"03 字标与字体"},{"file":"Pixels.dc.html","x":1520,"y":1080,"w":1440,"h":1000,"title":"04 像素小狼","is_interactive":true},{"file":"Screen.dc.html","x":0,"y":2200,"w":1440,"h":900,"title":"05 对话页 · 浅色"},{"file":"ScreenDark.dc.html","x":1520,"y":2200,"w":1440,"h":900,"title":"06 对话页 · 深色"},{"file":"Home.dc.html","x":0,"y":3220,"w":1440,"h":1560,"title":"07 官网首屏"},{"file":"Spread.dc.html","x":1520,"y":3220,"w":1440,"h":1400,"title":"08 传播"},{"file":"Pup.dc.html","x":3040,"y":3220,"w":240,"h":240,"title":"组件：像素小狼","is_interactive":true}],"sources":{"Main.dc.html":"\u003c!doctype html>\n\u003chtml lang=\"zh\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>格墨：方向\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Noto+Sans+SC:wght@500;700;900&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0}\na{color:#4D4AC6}a:hover{color:#1B1838}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"width: 1440px; height: 960px; box-sizing: border-box; padding: 72px 96px; background: #FFFFFF; color: #17161F; font-family: Inter, 'PingFang SC', sans-serif; display: flex; flex-direction: column; gap: 56px;\">\n\n  \u003cdiv style=\"display: flex; align-items: center; justify-content: space-between;\">\n    \u003cdiv style=\"display: flex; align-items: center; gap: 12px;\">\n      \u003cdc-import name=\"Pup\" face=\"smile\" cell=\"1.6\" hint-size=\"32px,32px\">\u003c/dc-import>\n      \u003cspan style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: #1B1838;\">ollupi\u003c/span>\n    \u003c/div>\n    \u003cspan style=\"font-size: 13px; color: #737284;\">设计语言 · 方向稿 v1 · 2026-11 · 分两层：产品安静，传播大声\u003c/span>\n  \u003c/div>\n\n  \u003cdiv style=\"display: flex; gap: 96px; align-items: flex-end;\">\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 20px; flex: 0 0 520px;\">\n      \u003ch1 style=\"margin: 0; font-family: 'Noto Sans SC', sans-serif; font-size: 128px; line-height: 1; font-weight: 900; color: #1B1838; letter-spacing: 0.02em;\">格墨\u003c/h1>\n      \u003cp style=\"margin: 0; font-family: 'Noto Sans SC', sans-serif; font-size: 28px; line-height: 40px; font-weight: 500; color: #52515F;\">安静的画布，一只大声的像素小狼。\u003c/p>\n    \u003c/div>\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 14px; padding-bottom: 6px;\">\n      \u003cp style=\"margin: 0; font-size: 17px; line-height: 28px; color: #17161F;\">\u003cb style=\"font-weight: 600; color: #1B1838;\">格\u003c/b>　小狼的 20×20 像素网格，是 Ollupi 的性格。传播时它是主角：头像、动图、贴纸、每次发版都有它。\u003c/p>\n      \u003cp style=\"margin: 0; font-size: 17px; line-height: 28px; color: #17161F;\">\u003cb style=\"font-weight: 600; color: #1B1838;\">墨\u003c/b>　产品界面是纸与墨。一个能跑命令的 agent 要让人信任，所以工作时安静，小狼只用来表示状态。\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px;\">\n    \u003cdiv style=\"border: 1px solid rgba(27,24,56,0.08); border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 18px;\">\n      \u003cdiv style=\"font-size: 13px; font-weight: 500; color: #737284;\">现在　四个源头，彼此不相干\u003c/div>\n      \u003cdiv style=\"display: grid; grid-template-columns: 96px minmax(0, 1fr); row-gap: 14px; column-gap: 16px; align-items: center; font-size: 14px; line-height: 20px;\">\n        \u003cspan style=\"color: #52515F;\">标志\u003c/span>\n        \u003cdiv style=\"display: flex; align-items: center; gap: 8px;\">\u003cspan style=\"width: 20px; height: 20px; border-radius: 4px; background: #1E1B4B;\">\u003c/span>\u003cspan style=\"width: 20px; height: 20px; border-radius: 4px; background: #A5B4FC;\">\u003c/span>\u003cspan style=\"width: 20px; height: 20px; border-radius: 4px; background: #F9A8D4;\">\u003c/span>\u003cspan style=\"color: #737284; margin-left: 6px;\">Tailwind 原色，未调\u003c/span>\u003c/div>\n        \u003cspan style=\"color: #52515F;\">字标\u003c/span>\n        \u003cdiv style=\"display: flex; align-items: center; gap: 8px;\">\u003cspan style=\"width: 20px; height: 20px; border-radius: 4px; background: #64748B;\">\u003c/span>\u003cspan style=\"color: #737284; margin-left: 6px;\">圆头无衬线，石板灰；小狼替代字母 o\u003c/span>\u003c/div>\n        \u003cspan style=\"color: #52515F;\">界面\u003c/span>\n        \u003cdiv style=\"display: flex; align-items: center; gap: 8px;\">\u003cspan style=\"width: 20px; height: 20px; border-radius: 4px; background: #F9F9F7; border: 1px solid rgba(0,0,0,0.08); box-sizing: border-box;\">\u003c/span>\u003cspan style=\"width: 20px; height: 20px; border-radius: 4px; background: #0D0D0D;\">\u003c/span>\u003cspan style=\"width: 20px; height: 20px; border-radius: 4px; background: #1F6BC9;\">\u003c/span>\u003cspan style=\"color: #737284; margin-left: 6px;\">照搬 Claude / Codex 的灰、墨、蓝\u003c/span>\u003c/div>\n        \u003cspan style=\"color: #52515F;\">配色\u003c/span>\n        \u003cdiv style=\"display: flex; align-items: center; gap: 8px;\">\u003cspan style=\"width: 20px; height: 20px; border-radius: 4px; background: linear-gradient(135deg, #2E1065, #134E4A);\">\u003c/span>\u003cspan style=\"width: 20px; height: 20px; border-radius: 4px; background: linear-gradient(135deg, #E11D48, #F97316);\">\u003c/span>\u003cspan style=\"width: 20px; height: 20px; border-radius: 4px; background: linear-gradient(135deg, #E9D5FF, #FBCFE8, #BBF7D0);\">\u003c/span>\u003cspan style=\"width: 20px; height: 20px; border-radius: 4px; background: conic-gradient(#FF3B30 0 60deg, #FF9500 0 120deg, #FFCC00 0 180deg, #34C759 0 240deg, #007AFF 0 300deg, #AF52DE 0);\">\u003c/span>\u003cspan style=\"color: #737284; margin-left: 6px;\">另外四套：极光、日落、糖果、彩虹\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv style=\"border: 1px solid rgba(27,24,56,0.16); border-radius: 12px; padding: 28px; display: flex; gap: 28px; align-items: center;\">\n      \u003cdc-import name=\"Pup\" face=\"smile\" cell=\"6\" hint-size=\"120px,120px\">\u003c/dc-import>\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 16px; flex: 1;\">\n        \u003cdiv style=\"font-size: 13px; font-weight: 500; color: #737284;\">之后　一个源头：小狼\u003c/div>\n        \u003cdiv style=\"display: flex; gap: 8px;\">\n          \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px; flex: 1;\">\u003cspan style=\"height: 40px; border-radius: 6px; background: #1B1838;\">\u003c/span>\u003cspan style=\"font-size: 12px; color: #52515F;\">夜 Night\u003c/span>\u003c/div>\n          \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px; flex: 1;\">\u003cspan style=\"height: 40px; border-radius: 6px; background: #4D4AC6;\">\u003c/span>\u003cspan style=\"font-size: 12px; color: #52515F;\">鸢尾 Iris\u003c/span>\u003c/div>\n          \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px; flex: 1;\">\u003cspan style=\"height: 40px; border-radius: 6px; background: #AEB5F5;\">\u003c/span>\u003cspan style=\"font-size: 12px; color: #52515F;\">薰衣 Lavender\u003c/span>\u003c/div>\n          \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px; flex: 1;\">\u003cspan style=\"height: 40px; border-radius: 6px; background: #EFF0FB; border: 1px solid rgba(27,24,56,0.08); box-sizing: border-box;\">\u003c/span>\u003cspan style=\"font-size: 12px; color: #52515F;\">雪 Snow\u003c/span>\u003c/div>\n          \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px; flex: 1;\">\u003cspan style=\"height: 40px; border-radius: 6px; background: #F4AACB;\">\u003c/span>\u003cspan style=\"font-size: 12px; color: #52515F;\">腮红 Blush\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv style=\"font-size: 14px; line-height: 20px; color: #52515F;\">轮廓、毛色、脸、腮红，每一种颜色都在小狼身上找得到。界面、图标、官网共用这五种。\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv style=\"display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px; border-top: 1px solid rgba(27,24,56,0.08); padding-top: 32px;\">\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px;\">\n      \u003cspan style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700; color: #4D4AC6;\">01\u003c/span>\n      \u003cspan style=\"font-size: 15px; font-weight: 600; color: #1B1838;\">一个源头\u003c/span>\n      \u003cspan style=\"font-size: 13px; line-height: 20px; color: #52515F;\">颜色、形状、语气都从小狼来。不再向别家对齐数值。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px;\">\n      \u003cspan style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700; color: #4D4AC6;\">02\u003c/span>\n      \u003cspan style=\"font-size: 15px; font-weight: 600; color: #1B1838;\">纸与墨\u003c/span>\n      \u003cspan style=\"font-size: 13px; line-height: 20px; color: #52515F;\">一屏 95% 是中性色。夜和鸢尾加起来不超过 5%，腮红只在小狼脸上。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px;\">\n      \u003cspan style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700; color: #4D4AC6;\">03\u003c/span>\n      \u003cspan style=\"font-size: 15px; font-weight: 600; color: #1B1838;\">两层音量\u003c/span>\n      \u003cspan style=\"font-size: 13px; line-height: 20px; color: #52515F;\">产品里小狼只表示状态，一屏一只。传播时它是主角，可以大、可以多、可以动。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px;\">\n      \u003cspan style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700; color: #4D4AC6;\">04\u003c/span>\n      \u003cspan style=\"font-size: 15px; font-weight: 600; color: #1B1838;\">字不抢戏\u003c/span>\n      \u003cspan style=\"font-size: 13px; line-height: 20px; color: #52515F;\">不用衬线。界面用 Inter；传播标题用 Bricolage Grotesque 加思源黑体粗体。性格交给小狼。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px;\">\n      \u003cspan style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700; color: #4D4AC6;\">05\u003c/span>\n      \u003cspan style=\"font-size: 15px; font-weight: 600; color: #1B1838;\">一套配色\u003c/span>\n      \u003cspan style=\"font-size: 13px; line-height: 20px; color: #52515F;\">浅色、深色各一份，跟随系统。不提供换肤：样子就是品牌。\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":960}}'>\nclass Component extends DCLogic {\n  renderVals() { return {}; }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Color.dc.html":"\u003c!doctype html>\n\u003chtml lang=\"zh\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>颜色\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;family=Noto+Sans+SC:wght@900&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"width: 1440px; height: 960px; box-sizing: border-box; padding: 64px 96px; background: #FFFFFF; color: #17161F; font-family: Inter, 'PingFang SC', sans-serif; display: flex; flex-direction: column; gap: 40px;\">\n\n  \u003cdiv style=\"display: flex; align-items: baseline; justify-content: space-between;\">\n    \u003ch2 style=\"margin: 0; font-family: 'Noto Sans SC', sans-serif; font-size: 40px; font-weight: 900; color: #1B1838;\">颜色\u003c/h2>\n    \u003cspan style=\"font-size: 14px; color: #52515F;\">五种品牌色都取自小狼，重新调过，不再是 Tailwind 原值。中性灰带一点夜的冷调，和标志同一个色温。\u003c/span>\n  \u003c/div>\n\n  \u003cdiv style=\"display: grid; grid-template-columns: 2fr 1.4fr 1.4fr 1.2fr 1fr; gap: 12px; height: 220px;\">\n    \u003cdiv style=\"background: #1B1838; border-radius: 12px; padding: 20px; color: #EFF0FB; display: flex; flex-direction: column; justify-content: space-between;\">\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 4px;\">\u003cspan style=\"font-size: 18px; font-weight: 600;\">夜 Night\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; opacity: 0.7;\">#1B1838\u003c/span>\u003c/div>\n      \u003cspan style=\"font-size: 13px; line-height: 19px; opacity: 0.85;\">小狼的轮廓。App 图标底色；浅色主题的主按钮、发送按钮、标题与字标。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"background: #4D4AC6; border-radius: 12px; padding: 20px; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between;\">\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 4px;\">\u003cspan style=\"font-size: 18px; font-weight: 600;\">鸢尾 Iris\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; opacity: 0.75;\">#4D4AC6 · 白字 6.8:1\u003c/span>\u003c/div>\n      \u003cspan style=\"font-size: 13px; line-height: 19px; opacity: 0.9;\">浅色主题的强调色：链接、焦点环、控件选中、等你回答。取代借来的蓝。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"background: #AEB5F5; border-radius: 12px; padding: 20px; color: #1B1838; display: flex; flex-direction: column; justify-content: space-between;\">\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 4px;\">\u003cspan style=\"font-size: 18px; font-weight: 600;\">薰衣 Lavender\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; opacity: 0.7;\">#AEB5F5\u003c/span>\u003c/div>\n      \u003cspan style=\"font-size: 13px; line-height: 19px;\">小狼的毛色。深色主题的强调色与发送按钮。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"background: #EFF0FB; border-radius: 12px; padding: 20px; color: #1B1838; display: flex; flex-direction: column; justify-content: space-between;\">\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 4px;\">\u003cspan style=\"font-size: 18px; font-weight: 600;\">雪 Snow\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; opacity: 0.7;\">#EFF0FB\u003c/span>\u003c/div>\n      \u003cspan style=\"font-size: 13px; line-height: 19px;\">小狼的脸。深色主题的主按钮。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"background: #F4AACB; border-radius: 12px; padding: 20px; color: #1B1838; display: flex; flex-direction: column; justify-content: space-between;\">\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 4px;\">\u003cspan style=\"font-size: 18px; font-weight: 600;\">腮红 Blush\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; opacity: 0.7;\">#F4AACB\u003c/span>\u003c/div>\n      \u003cspan style=\"font-size: 13px; line-height: 19px;\">只在小狼脸上。\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv style=\"display: flex; flex-direction: column; gap: 10px;\">\n    \u003cdiv style=\"display: flex; justify-content: space-between; font-size: 13px; color: #52515F;\">\u003cspan>产品界面一屏的颜色预算（传播物料不受限：可以整面铺夜色）\u003c/span>\u003cspan>纸 80 · 墨（文字）14 · 夜 4 · 鸢尾 1.5 · 腮红只在小狼身上\u003c/span>\u003c/div>\n    \u003cdiv style=\"display: flex; height: 16px; border-radius: 4px; overflow: hidden; border: 1px solid rgba(27,24,56,0.08);\">\n      \u003cspan style=\"flex: 80; background: #FFFFFF;\">\u003c/span>\n      \u003cspan style=\"flex: 14; background: #17161F;\">\u003c/span>\n      \u003cspan style=\"flex: 4; background: #1B1838; border-left: 1px solid #FFFFFF;\">\u003c/span>\n      \u003cspan style=\"flex: 1.5; background: #4D4AC6;\">\u003c/span>\n      \u003cspan style=\"flex: 0.5; background: #F4AACB;\">\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px;\">\n    \u003cdiv style=\"background: #F5F5F8; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px;\">\n      \u003cspan style=\"font-size: 13px; font-weight: 500; color: #52515F;\">浅色中性\u003c/span>\n      \u003cdiv style=\"display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;\">\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px;\">\u003cspan style=\"height: 48px; border-radius: 6px; background: #F5F5F8; border: 1px solid rgba(27,24,56,0.16);\">\u003c/span>\u003cspan style=\"font-size: 12px; color: #17161F;\">ground\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #737284;\">#F5F5F8\u003c/span>\u003c/div>\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px;\">\u003cspan style=\"height: 48px; border-radius: 6px; background: #FFFFFF; border: 1px solid rgba(27,24,56,0.08);\">\u003c/span>\u003cspan style=\"font-size: 12px; color: #17161F;\">canvas\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #737284;\">#FFFFFF\u003c/span>\u003c/div>\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px;\">\u003cspan style=\"height: 48px; border-radius: 6px; background: #F0F0F5; border: 1px solid rgba(27,24,56,0.08);\">\u003c/span>\u003cspan style=\"font-size: 12px; color: #17161F;\">surface\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #737284;\">#F0F0F5\u003c/span>\u003c/div>\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px;\">\u003cspan style=\"height: 48px; border-radius: 6px; background: #17161F;\">\u003c/span>\u003cspan style=\"font-size: 12px; color: #17161F;\">fg\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #737284;\">#17161F\u003c/span>\u003c/div>\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px;\">\u003cspan style=\"height: 48px; border-radius: 6px; background: #52515F;\">\u003c/span>\u003cspan style=\"font-size: 12px; color: #17161F;\">fg-muted\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #737284;\">#52515F\u003c/span>\u003c/div>\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px;\">\u003cspan style=\"height: 48px; border-radius: 6px; background: #737284;\">\u003c/span>\u003cspan style=\"font-size: 12px; color: #17161F;\">fg-subtle\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #737284;\">#737284 · 4.7:1\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cspan style=\"font-size: 12px; line-height: 18px; color: #52515F;\">线：夜 8% / 16%。悬停：夜 5%。选中：夜 7%。所有半透明都用夜，不用纯黑。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"background: #121119; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px;\">\n      \u003cspan style=\"font-size: 13px; font-weight: 500; color: #A6A5B6;\">深色中性\u003c/span>\n      \u003cdiv style=\"display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;\">\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px;\">\u003cspan style=\"height: 48px; border-radius: 6px; background: #121119; border: 1px solid rgba(239,240,251,0.16);\">\u003c/span>\u003cspan style=\"font-size: 12px; color: #ECEBF3;\">ground\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #84839A;\">#121119\u003c/span>\u003c/div>\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px;\">\u003cspan style=\"height: 48px; border-radius: 6px; background: #1B1A23; border: 1px solid rgba(239,240,251,0.08);\">\u003c/span>\u003cspan style=\"font-size: 12px; color: #ECEBF3;\">canvas\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #84839A;\">#1B1A23\u003c/span>\u003c/div>\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px;\">\u003cspan style=\"height: 48px; border-radius: 6px; background: #262530; border: 1px solid rgba(239,240,251,0.08);\">\u003c/span>\u003cspan style=\"font-size: 12px; color: #ECEBF3;\">surface\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #84839A;\">#262530\u003c/span>\u003c/div>\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px;\">\u003cspan style=\"height: 48px; border-radius: 6px; background: #EDECF4;\">\u003c/span>\u003cspan style=\"font-size: 12px; color: #ECEBF3;\">fg\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #84839A;\">#EDECF4\u003c/span>\u003c/div>\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px;\">\u003cspan style=\"height: 48px; border-radius: 6px; background: #B7B6C6;\">\u003c/span>\u003cspan style=\"font-size: 12px; color: #ECEBF3;\">fg-muted\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #84839A;\">#B7B6C6\u003c/span>\u003c/div>\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px;\">\u003cspan style=\"height: 48px; border-radius: 6px; background: #8B8AA0;\">\u003c/span>\u003cspan style=\"font-size: 12px; color: #ECEBF3;\">fg-subtle\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #84839A;\">#8B8AA0 · 5.2:1\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cspan style=\"font-size: 12px; line-height: 18px; color: #A6A5B6;\">线：雪 7.5% / 14%。屏幕比侧栏亮一级。主按钮是雪底夜字，强调色和发送是薰衣。\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv style=\"display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px;\">\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 12px;\">\n      \u003cspan style=\"font-size: 13px; font-weight: 500; color: #52515F;\">状态色（浅 / 深）\u003c/span>\n      \u003cdiv style=\"display: flex; gap: 20px; font-size: 13px;\">\n        \u003cdiv style=\"display: flex; align-items: center; gap: 8px;\">\u003cspan style=\"width: 16px; height: 16px; border-radius: 4px; background: #C42F4A;\">\u003c/span>\u003cspan style=\"width: 16px; height: 16px; border-radius: 4px; background: #F27088;\">\u003c/span>\u003cspan>danger 失败、完全访问\u003c/span>\u003c/div>\n        \u003cdiv style=\"display: flex; align-items: center; gap: 8px;\">\u003cspan style=\"width: 16px; height: 16px; border-radius: 4px; background: #9A5B00;\">\u003c/span>\u003cspan style=\"width: 16px; height: 16px; border-radius: 4px; background: #E2A746;\">\u003c/span>\u003cspan>warning 审批\u003c/span>\u003c/div>\n        \u003cdiv style=\"display: flex; align-items: center; gap: 8px;\">\u003cspan style=\"width: 16px; height: 16px; border-radius: 4px; background: #2F7D4F;\">\u003c/span>\u003cspan style=\"width: 16px; height: 16px; border-radius: 4px; background: #5DC48A;\">\u003c/span>\u003cspan>success 只用于 diff\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cspan style=\"font-size: 12px; line-height: 18px; color: #737284;\">红往玫瑰偏、黄往琥珀偏，和夜、薰衣同一个色温；三种只出现在图标、文字和 1px 描边上。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 20px; color: #17161F;\">\n      \u003cspan style=\"font-size: 13px; font-weight: 500; color: #52515F;\">不变的规则（沿用 design-guidelines）\u003c/span>\n      \u003cspan>· 强调色只用于焦点、控件选中、链接、进度、等你回答。\u003c/span>\n      \u003cspan>· 成功不着色；状态色不做块的底色。\u003c/span>\n      \u003cspan>· 不再有 palette 切换：去掉 aurora、sunset、candy、rainbow。\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":960}}'>\nclass Component extends DCLogic {\n  renderVals() { return {}; }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Type.dc.html":"\u003c!doctype html>\n\u003chtml lang=\"zh\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>字标与字体\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Noto+Sans+SC:wght@500;700;900&amp;family=Nunito:wght@600&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"width: 1440px; height: 1000px; box-sizing: border-box; padding: 64px 96px; background: #FFFFFF; color: #17161F; font-family: Inter, 'PingFang SC', sans-serif; display: flex; flex-direction: column; gap: 40px;\">\n\n  \u003cdiv style=\"display: flex; align-items: baseline; justify-content: space-between;\">\n    \u003ch2 style=\"margin: 0; font-family: 'Noto Sans SC', sans-serif; font-size: 40px; font-weight: 900; color: #1B1838;\">字标与字体\u003c/h2>\n    \u003cspan style=\"font-size: 14px; color: #52515F;\">不用衬线：衬线大标题是 Anthropic 的招牌，也是 AI 公司最常抄的样子。字只负责清楚，性格交给小狼。\u003c/span>\n  \u003c/div>\n\n  \u003cdiv style=\"display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 16px; height: 280px;\">\n    \u003cdiv style=\"border: 1px dashed rgba(27,24,56,0.16); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between;\">\n      \u003cspan style=\"font-size: 12px; font-weight: 500; color: #737284;\">现在\u003c/span>\n      \u003cdiv style=\"display: flex; align-items: center; gap: 2px;\">\n        \u003cdc-import name=\"Pup\" face=\"oh\" cell=\"2.6\" hint-size=\"52px,52px\">\u003c/dc-import>\n        \u003cspan style=\"font-family: Nunito, sans-serif; font-size: 56px; font-weight: 600; color: #64748B; letter-spacing: 0.02em; line-height: 1;\">llupi\u003c/span>\n      \u003c/div>\n      \u003cspan style=\"font-size: 12px; line-height: 18px; color: #737284;\">像素和圆体两种形状，石板灰和靛紫两种颜色；小狼当字母用，字标读作 \"llupi\"。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"background: #F5F5F8; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between;\">\n      \u003cspan style=\"font-size: 12px; font-weight: 500; color: #737284;\">之后：横版组合\u003c/span>\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 14px;\">\n        \u003cdiv style=\"display: flex; align-items: center; gap: 16px;\">\n          \u003cdc-import name=\"Pup\" face=\"smile\" cell=\"3.4\" hint-size=\"68px,68px\">\u003c/dc-import>\n          \u003cspan style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 80px; font-weight: 700; color: #1B1838; letter-spacing: -0.035em; line-height: 1;\">ollupi\u003c/span>\n        \u003c/div>\n        \u003cspan style=\"font-size: 14px; color: #52515F;\">\u003cspan style=\"font-family: 'JetBrains Mono', monospace; color: #1B1838;\">[读音]\u003c/span>　·　[名字的来历，一句话]\u003c/span>\n      \u003c/div>\n      \u003cspan style=\"font-size: 12px; line-height: 18px; color: #52515F;\">Bricolage Grotesque 700，夜色，全小写，字距 −3.5%。小狼高 = 字高，间距 = 小狼宽的 ¼。读音和来历跟着字标走，第一次出现就讲清楚。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"display: grid; grid-template-rows: 1fr 1fr; gap: 16px;\">\n      \u003cdiv style=\"background: #1B1838; border-radius: 12px; padding: 0 24px; display: flex; align-items: center; gap: 14px;\">\n        \u003cdc-import name=\"Pup\" face=\"smile\" cell=\"2.2\" hint-size=\"44px,44px\">\u003c/dc-import>\n        \u003cspan style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 48px; font-weight: 700; color: #EFF0FB; letter-spacing: -0.035em;\">ollupi\u003c/span>\n      \u003c/div>\n      \u003cdiv style=\"border: 1px solid rgba(27,24,56,0.08); border-radius: 12px; padding: 0 24px; display: flex; align-items: center; gap: 20px;\">\n        \u003cdiv style=\"width: 80px; height: 80px; border-radius: 18px; background: #1B1838; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">\n          \u003cdc-import name=\"Pup\" face=\"grin\" cell=\"3\" hint-size=\"60px,60px\">\u003c/dc-import>\n        \u003c/div>\n        \u003cspan style=\"font-size: 12px; line-height: 18px; color: #52515F;\">App 图标：夜底咧嘴笑。轮廓和底色融成一体，只剩毛色和脸。\u003c/span>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv style=\"display: grid; grid-template-columns: 1.25fr 1fr; gap: 56px;\">\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 18px;\">\n      \u003cspan style=\"font-size: 13px; font-weight: 500; color: #52515F;\">传播的声音：Bricolage Grotesque + 思源黑体 Heavy　用于官网、README、发版卡片、社媒\u003c/span>\n      \u003cdiv style=\"font-family: 'Bricolage Grotesque', 'Noto Sans SC', sans-serif; font-size: 60px; line-height: 68px; font-weight: 800; color: #1B1838; letter-spacing: -0.02em;\">一只住在你 Mac 里、\u003cbr>会干活的像素小狼。\u003c/div>\n      \u003cdiv style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; line-height: 36px; font-weight: 600; color: #4D4AC6; letter-spacing: -0.02em;\">A pixel wolf pup that works on your Mac.\u003c/div>\n      \u003cdiv style=\"display: flex; gap: 24px; font-size: 12px; color: #737284;\">\n        \u003cspan>hero 64/72 · 800\u003c/span>\u003cspan>h2 36/44 · 700\u003c/span>\u003cspan>lead 20/32 · Inter 400\u003c/span>\u003cspan>中文标题用思源黑体 900，不用宋体\u003c/span>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 14px;\">\n      \u003cspan style=\"font-size: 13px; font-weight: 500; color: #52515F;\">工作的声音：Inter + 苹方，JetBrains Mono　阶梯沿用现有六级\u003c/span>\n      \u003cdiv style=\"display: grid; grid-template-columns: 96px minmax(0, 1fr); row-gap: 12px; align-items: baseline; border-top: 1px solid rgba(27,24,56,0.08); padding-top: 14px;\">\n        \u003cspan style=\"font-size: 12px; color: #737284;\">display 20\u003c/span>\u003cspan style=\"font-size: 20px; line-height: 28px; font-weight: 600;\">New conversation\u003c/span>\n        \u003cspan style=\"font-size: 12px; color: #737284;\">body 15\u003c/span>\u003cspan style=\"font-size: 15px; line-height: 24px;\">改好了 auth.ts 里的过期判断，测试全部通过。\u003c/span>\n        \u003cspan style=\"font-size: 12px; color: #737284;\">title 15\u003c/span>\u003cspan style=\"font-size: 15px; line-height: 22px; font-weight: 600;\">Allow this command?\u003c/span>\n        \u003cspan style=\"font-size: 12px; color: #737284;\">ui 13\u003c/span>\u003cspan style=\"font-size: 13px; line-height: 20px; color: #52515F;\">Worked for 42s · 6 commands · 2 files changed\u003c/span>\n        \u003cspan style=\"font-size: 12px; color: #737284;\">small 12\u003c/span>\u003cspan style=\"font-size: 12px; line-height: 18px; color: #737284;\">ollupi-desktop · 3 min ago\u003c/span>\n        \u003cspan style=\"font-size: 12px; color: #737284;\">mono 13\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 20px; color: #17161F;\">pnpm -r typecheck\u003c/span>\n      \u003c/div>\n      \u003cspan style=\"font-size: 12px; line-height: 18px; color: #737284;\">产品界面里只有新会话页的问候可以借一次 Bricolage，其余全是 Inter。\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":1000}}'>\nclass Component extends DCLogic {\n  renderVals() { return {}; }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Pixels.dc.html":"\u003c!doctype html>\n\u003chtml lang=\"zh\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>像素小狼\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;family=Noto+Sans+SC:wght@900&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"width: 1440px; height: 1000px; box-sizing: border-box; padding: 64px 96px; background: #FFFFFF; color: #17161F; font-family: Inter, 'PingFang SC', sans-serif; display: flex; flex-direction: column; gap: 36px;\">\n\n  \u003cdiv style=\"display: flex; align-items: baseline; justify-content: space-between;\">\n    \u003ch2 style=\"margin: 0; font-family: 'Noto Sans SC', sans-serif; font-size: 40px; font-weight: 900; color: #1B1838;\">像素小狼 · 产品里\u003c/h2>\n    \u003cspan style=\"font-size: 14px; color: #52515F;\">在产品里，小狼不是装饰，是状态：每张脸只对应一种状态，一屏最多一只。传播时的规则见 08。\u003c/span>\n  \u003c/div>\n\n  \u003cdiv style=\"display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px;\">\n    \u003cdiv style=\"background: #F5F5F8; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px;\">\n      \u003cdiv style=\"height: 120px; display: flex; align-items: center; justify-content: center;\">\u003cdc-import name=\"Pup\" animate=\"think\" cell=\"5\" hint-size=\"100px,100px\">\u003c/dc-import>\u003c/div>\n      \u003cspan style=\"font-size: 15px; font-weight: 600; color: #1B1838;\">思考\u003c/span>\n      \u003cspan style=\"font-size: 12px; line-height: 18px; color: #52515F;\">左右看，偶尔眨眼。agent 运行中：输入框上方的状态行，20px。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"background: #F5F5F8; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px;\">\n      \u003cdiv style=\"height: 120px; display: flex; align-items: center; justify-content: center;\">\u003cdc-import name=\"Pup\" face=\"oh\" cell=\"5\" hint-size=\"100px,100px\">\u003c/dc-import>\u003c/div>\n      \u003cspan style=\"font-size: 15px; font-weight: 600; color: #1B1838;\">看着你\u003c/span>\n      \u003cspan style=\"font-size: 12px; line-height: 18px; color: #52515F;\">等你批准或回答。替代思考那只，出现在同一个位置。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"background: #F5F5F8; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px;\">\n      \u003cdiv style=\"height: 120px; display: flex; align-items: center; justify-content: center;\">\u003cdc-import name=\"Pup\" animate=\"blink\" cell=\"5\" hint-size=\"100px,100px\">\u003c/dc-import>\u003c/div>\n      \u003cspan style=\"font-size: 15px; font-weight: 600; color: #1B1838;\">闲着\u003c/span>\n      \u003cspan style=\"font-size: 12px; line-height: 18px; color: #52515F;\">微笑，每三秒眨一次眼。新会话页的问候旁，40px。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"background: #F5F5F8; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px;\">\n      \u003cdiv style=\"height: 120px; display: flex; align-items: center; justify-content: center;\">\u003cdc-import name=\"Pup\" face=\"grin\" cell=\"5\" hint-size=\"100px,100px\">\u003c/dc-import>\u003c/div>\n      \u003cspan style=\"font-size: 15px; font-weight: 600; color: #1B1838;\">完成\u003c/span>\n      \u003cspan style=\"font-size: 12px; line-height: 18px; color: #52515F;\">App 图标、\"做完了\"的系统通知。界面里不庆祝：成功是常态。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"background: #F5F5F8; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px;\">\n      \u003cdiv style=\"height: 120px; display: flex; align-items: center; justify-content: center;\">\u003cdc-import name=\"Pup\" face=\"smile\" cell=\"5\" hint-size=\"100px,100px\">\u003c/dc-import>\u003c/div>\n      \u003cspan style=\"font-size: 15px; font-weight: 600; color: #1B1838;\">标志\u003c/span>\n      \u003cspan style=\"font-size: 12px; line-height: 18px; color: #52515F;\">字标、官网、关于页、侧栏顶部的品牌位。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"border: 1px dashed rgba(27,24,56,0.16); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px;\">\n      \u003cdiv style=\"height: 120px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #C42F4A;\">exit 1\u003c/div>\n      \u003cspan style=\"font-size: 15px; font-weight: 600; color: #1B1838;\">出错：没有小狼\u003c/span>\n      \u003cspan style=\"font-size: 12px; line-height: 18px; color: #52515F;\">出错时不卖萌。失败只用图标、红字和原始输出说话。\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;\">\n    \u003cdiv style=\"border: 1px solid rgba(27,24,56,0.08); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px;\">\n      \u003cspan style=\"font-size: 13px; font-weight: 500; color: #52515F;\">流式输出的光标\u003c/span>\n      \u003cdiv style=\"font-size: 15px; line-height: 24px; color: #17161F;\">已经找到问题：token 过期时间用的是秒，比较时当成了毫秒\u003cspan style=\"display: inline-block; width: 8px; height: 16px; margin-left: 2px; vertical-align: -2px; background: #1B1838; opacity: {{cursorOpacity}};\">\u003c/span>\u003c/div>\n      \u003cspan style=\"font-size: 12px; line-height: 18px; color: #737284;\">一个夜色像素块，8×16，530ms 一亮一灭，硬切不渐变。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"border: 1px solid rgba(27,24,56,0.08); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px;\">\n      \u003cspan style=\"font-size: 13px; font-weight: 500; color: #52515F;\">加载\u003c/span>\n      \u003cdiv style=\"height: 24px; display: flex; align-items: center; gap: 4px;\">\n        \u003csc-for list=\"{{dots}}\" as=\"d\" hint-placeholder-count=\"3\">\u003cspan style=\"width: 6px; height: 6px; background: {{d}};\">\u003c/span>\u003c/sc-for>\n        \u003cspan style=\"font-size: 13px; color: #52515F; margin-left: 8px;\">Connecting to ollupid\u003c/span>\n      \u003c/div>\n      \u003cspan style=\"font-size: 12px; line-height: 18px; color: #737284;\">三个方形像素依次亮起，300ms 一拍。不用圆形 spinner。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"border: 1px solid rgba(27,24,56,0.08); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px;\">\n      \u003cspan style=\"font-size: 13px; font-weight: 500; color: #52515F;\">发送按钮：像素箭头\u003c/span>\n      \u003cdiv style=\"display: flex; align-items: center; gap: 16px;\">\n        \u003cbutton aria-label=\"Send\" style=\"width: 32px; height: 32px; border-radius: 8px; border: 0; background: #1B1838; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;\">\n          \u003cspan style=\"width: 14px; height: 14px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: repeat(7, minmax(0, 1fr));\">\u003csc-for list=\"{{arrowLight}}\" as=\"a\" hint-placeholder-count=\"49\">\u003cspan style=\"background: {{a}};\">\u003c/span>\u003c/sc-for>\u003c/span>\n        \u003c/button>\n        \u003cdiv style=\"background: #111018; border-radius: 10px; padding: 8px;\">\n          \u003cbutton aria-label=\"Send\" style=\"width: 32px; height: 32px; border-radius: 8px; border: 0; background: #AEB5F5; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;\">\n            \u003cspan style=\"width: 14px; height: 14px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: repeat(7, minmax(0, 1fr));\">\u003csc-for list=\"{{arrowDark}}\" as=\"a\" hint-placeholder-count=\"49\">\u003cspan style=\"background: {{a}};\">\u003c/span>\u003c/sc-for>\u003c/span>\n          \u003c/button>\n        \u003c/div>\n        \u003cspan style=\"font-size: 12px; line-height: 18px; color: #737284;\">全界面唯一的像素图标。其余图标仍是 lucide。\u003c/span>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; font-size: 13px; line-height: 22px;\">\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px;\">\n      \u003cspan style=\"font-weight: 600; color: #1B1838;\">要\u003c/span>\n      \u003cspan>· 像素动在节拍上（steps，硬切）；界面动在曲线上（ease-standard）。两种节奏不混。\u003c/span>\n      \u003cspan>· 尺寸取 20 的整数倍：20、40、60、120、240；16 只给 favicon 和系统通知。格子要落在整像素上。\u003c/span>\n      \u003cspan>· 小狼出现在固定位置：状态行、新会话页、图标、官网。用户学会了就知道去哪看。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px;\">\n      \u003cspan style=\"font-weight: 600; color: #C42F4A;\">不要（产品里）\u003c/span>\n      \u003cspan>· 不用像素字体，不给按钮、卡片、边框做像素锯齿。\u003c/span>\n      \u003cspan>· 产品里只用这六张脸；新表情只进传播物料（见 08）。任何场合都不旋转、不拉伸、不换色。\u003c/span>\n      \u003cspan>· 不在同一屏放两只；不在对话流的每条消息旁边放头像。\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":1000}}'>\nvar ARROW = [\n  '...#...',\n  '..###..',\n  '.#.#.#.',\n  '#..#..#',\n  '...#...',\n  '...#...',\n  '...#...'\n];\nfunction arrow(color) {\n  var out = [];\n  ARROW.forEach(function (row) {\n    for (var i = 0; i \u003c row.length; i++) out.push(row[i] === '#' ? color : 'transparent');\n  });\n  return out;\n}\nclass Component extends DCLogic {\n  state = { tick: 0 };\n  componentDidMount() {\n    var self = this;\n    this.timer = setInterval(function () { self.setState({ tick: self.state.tick + 1 }); }, 300);\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n  renderVals() {\n    var t = this.state.tick;\n    var lit = t % 4;\n    var dots = [0, 1, 2].map(function (i) { return i === lit ? '#1B1838' : '#D9DAF0'; });\n    return {\n      dots: dots,\n      cursorOpacity: Math.floor(t / 2) % 2 === 0 ? 1 : 0,\n      arrowLight: arrow('#EFF0FB'),\n      arrowDark: arrow('#1B1838')\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Screen.dc.html":"\u003c!doctype html>\n\u003chtml lang=\"zh\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>对话页\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0}\n.ol-light{--ground:#F5F5F8;--canvas:#FFFFFF;--surface:#F0F0F5;--raised:#FFFFFF;--selected:rgba(27,24,56,.07);--line:rgba(27,24,56,.08);--line-strong:rgba(27,24,56,.16);--fg:#17161F;--fg-muted:#52515F;--fg-subtle:#737284;--ink:#1B1838;--ink-fg:#FFFFFF;--accent:#4D4AC6;--accent-ring:rgba(77,74,198,.35);--send:#1B1838;--success:#2F7D4F;--danger:#C42F4A;--add:rgba(47,125,79,.10);--del:rgba(196,47,74,.08);--shadow:0 1px 2px rgba(27,24,56,.05),0 8px 24px rgba(27,24,56,.07)}\n.ol-dark{--ground:#121119;--canvas:#1B1A23;--surface:#262530;--raised:#25242F;--selected:rgba(239,240,251,.09);--line:rgba(239,240,251,.075);--line-strong:rgba(239,240,251,.14);--fg:#EDECF4;--fg-muted:#B7B6C6;--fg-subtle:#8B8AA0;--ink:#EFF0FB;--ink-fg:#1B1838;--accent:#AEB5F5;--accent-ring:rgba(174,181,245,.35);--send:#AEB5F5;--success:#5DC48A;--danger:#F27088;--add:rgba(93,196,138,.12);--del:rgba(242,112,136,.10);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv class=\"{{modeClass}}\" style=\"width: 1440px; height: 900px; display: flex; background: var(--ground); color: var(--fg); font-family: Inter, 'PingFang SC', sans-serif; font-size: 13px; line-height: 20px; overflow: hidden;\">\n\n  \u003cnav aria-label=\"Conversations\" style=\"width: 264px; flex-shrink: 0; display: flex; flex-direction: column; padding: 0 8px 12px;\">\n    \u003cdiv style=\"height: 40px; display: flex; align-items: center; gap: 8px; padding-left: 6px;\">\n      \u003cspan style=\"width: 12px; height: 12px; border-radius: 6px; background: #FF5F57;\">\u003c/span>\u003cspan style=\"width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E;\">\u003c/span>\u003cspan style=\"width: 12px; height: 12px; border-radius: 6px; background: #28C840;\">\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 2px;\">\n      \u003ca href=\"#\" style=\"height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 6px; color: var(--fg); text-decoration: none; font-weight: 500;\">\u003csvg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\">\u003cpath d=\"M12 5v14M5 12h14\">\u003c/path>\u003c/svg>New conversation\u003c/a>\n      \u003ca href=\"#\" style=\"height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 6px; color: var(--fg-muted); text-decoration: none;\">\u003csvg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\">\u003ccircle cx=\"11\" cy=\"11\" r=\"7\">\u003c/circle>\u003cpath d=\"M20 20l-3.5-3.5\">\u003c/path>\u003c/svg>Search\u003c/a>\n      \u003ca href=\"#\" style=\"height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 6px; color: var(--fg-muted); text-decoration: none;\">\u003csvg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cpath d=\"M12 7v5l3 2\">\u003c/path>\u003c/svg>Scheduled\u003c/a>\n    \u003c/div>\n\n    \u003cdiv style=\"margin-top: 20px; display: flex; flex-direction: column; gap: 2px;\">\n      \u003cdiv style=\"height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--fg-subtle); font-size: 12px;\">\u003csvg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linejoin=\"round\">\u003cpath d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\">\u003c/path>\u003c/svg>ollupi-desktop\u003c/div>\n      \u003ca href=\"#\" style=\"height: 28px; display: flex; align-items: center; padding: 0 8px 0 32px; border-radius: 6px; background: var(--selected); color: var(--fg); text-decoration: none; font-weight: 500;\">Fix token expiry check\u003cspan style=\"margin-left: auto; width: 6px; height: 6px; border-radius: 3px; background: var(--accent);\" aria-label=\"Waiting for you\">\u003c/span>\u003c/a>\n      \u003ca href=\"#\" style=\"height: 28px; display: flex; align-items: center; padding: 0 8px 0 32px; border-radius: 6px; color: var(--fg-muted); text-decoration: none;\">Design language direction\u003c/a>\n      \u003ca href=\"#\" style=\"height: 28px; display: flex; align-items: center; padding: 0 8px 0 32px; border-radius: 6px; color: var(--fg-muted); text-decoration: none;\">Release 0.7.31\u003c/a>\n    \u003c/div>\n    \u003cdiv style=\"margin-top: 12px; display: flex; flex-direction: column; gap: 2px;\">\n      \u003cdiv style=\"height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--fg-subtle); font-size: 12px;\">\u003csvg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linejoin=\"round\">\u003cpath d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\">\u003c/path>\u003c/svg>ollupi\u003c/div>\n      \u003ca href=\"#\" style=\"height: 28px; display: flex; align-items: center; padding: 0 8px 0 32px; border-radius: 6px; color: var(--fg-muted); text-decoration: none;\">Word escalation prompts\u003c/a>\n      \u003ca href=\"#\" style=\"height: 28px; display: flex; align-items: center; padding: 0 8px 0 32px; border-radius: 6px; color: var(--fg-muted); text-decoration: none;\">Allow long messages\u003c/a>\n    \u003c/div>\n\n    \u003cdiv style=\"margin-top: auto; display: flex; flex-direction: column; gap: 2px;\">\n      \u003ca href=\"#\" style=\"height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 6px; color: var(--fg-muted); text-decoration: none;\">\u003csvg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linejoin=\"round\">\u003cpath d=\"M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z\">\u003c/path>\u003c/svg>Memory\u003c/a>\n      \u003ca href=\"#\" style=\"height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 6px; color: var(--fg-muted); text-decoration: none;\">\u003csvg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\">\u003cpath d=\"M4 7h10M18 7h2M4 17h4M12 17h8\">\u003c/path>\u003ccircle cx=\"16\" cy=\"7\" r=\"2\">\u003c/circle>\u003ccircle cx=\"10\" cy=\"17\" r=\"2\">\u003c/circle>\u003c/svg>Settings\u003c/a>\n    \u003c/div>\n  \u003c/nav>\n\n  \u003cmain style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--canvas); border-left: 1px solid var(--line);\">\n    \u003cheader style=\"height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line);\">\n      \u003cspan style=\"font-weight: 600;\">Fix token expiry check\u003c/span>\n      \u003cspan style=\"color: var(--fg-subtle);\">ollupi-desktop\u003c/span>\n      \u003cspan style=\"margin-left: auto; height: 20px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--accent-ring); color: var(--accent); font-size: 11px; font-weight: 500;\">Waiting for you\u003c/span>\n      \u003cbutton aria-label=\"Context\" style=\"width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--fg-muted); display: flex; align-items: center; justify-content: center;\">\u003csvg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\">\u003crect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\">\u003c/rect>\u003cpath d=\"M15 4v16\">\u003c/path>\u003c/svg>\u003c/button>\n    \u003c/header>\n\n    \u003cdiv style=\"flex: 1; min-height: 0; overflow: hidden; display: flex; justify-content: center; padding: 32px 24px 0;\">\n      \u003cdiv style=\"width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 20px;\">\n        \u003cdiv style=\"align-self: flex-end; max-width: 560px; background: var(--surface); border-radius: 12px; padding: 10px 14px; font-size: 15px; line-height: 24px;\">登录过一会儿就失效了，帮我查一下 auth 里的过期判断。\u003c/div>\n\n        \u003cdiv style=\"display: flex; align-items: center; gap: 6px; color: var(--fg-muted);\">\n          \u003csvg aria-hidden=\"true\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\u003cpath d=\"M9 6l6 6-6 6\">\u003c/path>\u003c/svg>\n          \u003cspan>Worked for 42s · 6 commands · 2 files changed\u003c/span>\n          \u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--success);\">+12\u003c/span>\u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--danger);\">−3\u003c/span>\n        \u003c/div>\n\n        \u003cdiv style=\"font-size: 15px; line-height: 24px; display: flex; flex-direction: column; gap: 12px;\">\n          \u003cp style=\"margin: 0;\">找到了。\u003ccode style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; background: var(--selected); padding: 1px 5px; border-radius: 4px;\">expiresAt\u003c/code> 存的是秒，\u003ccode style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; background: var(--selected); padding: 1px 5px; border-radius: 4px;\">isExpired()\u003c/code> 却拿它和 \u003ccode style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; background: var(--selected); padding: 1px 5px; border-radius: 4px;\">Date.now()\u003c/code> 的毫秒比，所以 token 一签出来就被当成过期。\u003c/p>\n          \u003cdiv style=\"background: var(--surface); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 20px; overflow: hidden;\">\n            \u003cdiv style=\"padding: 6px 12px; font-family: Inter, sans-serif; font-size: 12px; color: var(--fg-subtle); border-bottom: 1px solid var(--line);\">src/auth/session.ts\u003c/div>\n            \u003cdiv style=\"padding: 0 12px; background: var(--del);\">−  return session.expiresAt &lt; Date.now()\u003c/div>\n            \u003cdiv style=\"padding: 0 12px; background: var(--add);\">+  return session.expiresAt * 1000 &lt; Date.now()\u003c/div>\n          \u003c/div>\n          \u003cp style=\"margin: 0;\">改成统一用毫秒，并补了一个测试。refresh 那边也用了同一个字段。\u003c/p>\n        \u003c/div>\n\n        \u003csection aria-label=\"Question\" style=\"background: var(--raised); border: 1px solid var(--accent-ring); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px;\">\n          \u003cdiv style=\"display: flex; flex-direction: column; gap: 2px;\">\n            \u003cspan style=\"font-size: 11px; line-height: 16px; font-weight: 500; color: var(--accent);\">Ollupi is asking\u003c/span>\n            \u003cspan style=\"font-size: 15px; line-height: 22px; font-weight: 600;\">顺便检查 refresh 的逻辑吗？\u003c/span>\n          \u003c/div>\n          \u003cdiv style=\"display: flex; flex-direction: column; gap: 2px;\">\n            \u003clabel style=\"height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 6px; background: var(--selected);\">\u003cinput type=\"radio\" name=\"q\" checked=\"\" style=\"accent-color: var(--accent); margin: 0;\">检查，并修好发现的问题\u003c/label>\n            \u003clabel style=\"height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 6px;\">\u003cinput type=\"radio\" name=\"q\" style=\"accent-color: var(--accent); margin: 0;\">只检查，告诉我结果\u003c/label>\n            \u003clabel style=\"height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 6px;\">\u003cinput type=\"radio\" name=\"q\" style=\"accent-color: var(--accent); margin: 0;\">先不用\u003c/label>\n          \u003c/div>\n          \u003cdiv style=\"display: flex; justify-content: flex-end; gap: 8px;\">\n            \u003cbutton style=\"height: 28px; padding: 0 12px; border-radius: 6px; border: 0; background: transparent; color: var(--fg-muted); font: inherit; font-weight: 500;\">Skip\u003c/button>\n            \u003cbutton style=\"height: 28px; padding: 0 12px; border-radius: 6px; border: 0; background: var(--ink); color: var(--ink-fg); font: inherit; font-weight: 500;\">Answer\u003c/button>\n          \u003c/div>\n        \u003c/section>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv style=\"flex-shrink: 0; display: flex; justify-content: center; padding: 12px 24px 20px;\">\n      \u003cdiv style=\"width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 8px;\">\n        \u003cdiv style=\"display: flex; align-items: center; gap: 8px; color: var(--fg-muted); padding-left: 4px;\">\n          \u003cdc-import name=\"Pup\" face=\"oh\" cell=\"1\" hint-size=\"20px,20px\">\u003c/dc-import>\n          \u003cspan>Waiting for your answer\u003c/span>\n        \u003c/div>\n        \u003cdiv style=\"border: 1px solid var(--line-strong); border-radius: 12px; background: var(--canvas); padding: 12px 12px 10px 14px; display: flex; flex-direction: column; gap: 10px;\">\n          \u003clabel style=\"position: absolute; left: -9999px;\" for=\"composer\">Message\u003c/label>\n          \u003cinput id=\"composer\" placeholder=\"Reply to Ollupi…\" style=\"border: 0; outline: none; background: transparent; color: var(--fg); font: inherit; font-size: 15px; line-height: 24px; padding: 0;\">\n          \u003cdiv style=\"display: flex; align-items: center; gap: 8px; color: var(--fg-muted); font-size: 12px;\">\n            \u003cspan style=\"height: 24px; display: flex; align-items: center; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line);\">Default model\u003c/span>\n            \u003cspan style=\"height: 24px; display: flex; align-items: center; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line);\">Ask before edits\u003c/span>\n            \u003cbutton aria-label=\"Send\" style=\"margin-left: auto; width: 32px; height: 32px; border-radius: 8px; border: 0; background: var(--send); display: flex; align-items: center; justify-content: center; padding: 0;\">\n              \u003cspan style=\"width: 14px; height: 14px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: repeat(7, minmax(0, 1fr));\">\u003csc-for list=\"{{arrow}}\" as=\"a\" hint-placeholder-count=\"49\">\u003cspan style=\"background: {{a}};\">\u003c/span>\u003c/sc-for>\u003c/span>\n            \u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"mode\":{\"editor\":\"enum\",\"options\":[\"light\",\"dark\"],\"default\":\"light\"},\"$preview\":{\"width\":1440,\"height\":900}}'>\nvar ARROW = ['...#...', '..###..', '.#.#.#.', '#..#..#', '...#...', '...#...', '...#...'];\nclass Component extends DCLogic {\n  renderVals() {\n    var mode = this.props.mode || 'light';\n    var color = mode === 'dark' ? '#1B1838' : '#EFF0FB';\n    var arrow = [];\n    ARROW.forEach(function (row) {\n      for (var i = 0; i \u003c row.length; i++) arrow.push(row[i] === '#' ? color : 'transparent');\n    });\n    return { modeClass: mode === 'dark' ? 'ol-dark' : 'ol-light', arrow: arrow };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","ScreenDark.dc.html":"\u003c!doctype html>\n\u003chtml lang=\"zh\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>对话页 · 深色\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003cstyle>\nbody{margin:0}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"width: 1440px; height: 900px;\">\n  \u003cdc-import name=\"Screen\" mode=\"dark\" hint-size=\"1440px,900px\">\u003c/dc-import>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":900}}'>\nclass Component extends DCLogic {\n  renderVals() { return {}; }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Home.dc.html":"\u003c!doctype html>\n\u003chtml lang=\"zh\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>官网首屏\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Noto+Sans+SC:wght@700;900&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0}\na{color:#AEB5F5}a:hover{color:#EFF0FB}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"width: 1440px; height: 1560px; box-sizing: border-box; background: #F5F5F8; color: #17161F; font-family: Inter, 'PingFang SC', sans-serif; display: flex; flex-direction: column; align-items: center; overflow: hidden;\">\n\n  \u003cdiv style=\"width: 100%; height: 760px; flex-shrink: 0; background: #1B1838; display: flex; flex-direction: column; align-items: center;\">\n    \u003cheader style=\"width: 100%; max-width: 1200px; height: 72px; display: flex; align-items: center; gap: 32px;\">\n      \u003ca href=\"#\" style=\"display: flex; align-items: center; gap: 10px; text-decoration: none;\">\n        \u003cdc-import name=\"Pup\" face=\"smile\" cell=\"1.4\" hint-size=\"28px,28px\">\u003c/dc-import>\n        \u003cspan style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 700; color: #EFF0FB; letter-spacing: -0.035em;\">ollupi\u003c/span>\n      \u003c/a>\n      \u003cnav aria-label=\"Main\" style=\"display: flex; gap: 24px; font-size: 14px; margin-left: auto;\">\n        \u003ca href=\"#\" style=\"text-decoration: none;\">文档\u003c/a>\n        \u003ca href=\"#\" style=\"text-decoration: none;\">更新日志\u003c/a>\n        \u003ca href=\"#\" style=\"text-decoration: none;\">GitHub\u003c/a>\n      \u003c/nav>\n      \u003ca href=\"#\" style=\"height: 36px; display: flex; align-items: center; padding: 0 16px; border-radius: 8px; background: #EFF0FB; color: #1B1838; text-decoration: none; font-size: 14px; font-weight: 600;\">下载\u003c/a>\n    \u003c/header>\n\n    \u003csection style=\"display: flex; align-items: center; gap: 56px; padding-top: 88px;\">\n      \u003cdc-import name=\"Pup\" animate=\"blink\" cell=\"10\" hint-size=\"200px,200px\">\u003c/dc-import>\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 20px;\">\n        \u003ch1 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Noto Sans SC', sans-serif; font-size: 72px; line-height: 80px; font-weight: 800; color: #EFF0FB; letter-spacing: -0.02em;\">一只住在你 Mac 里、\u003cbr>会干活的像素小狼。\u003c/h1>\n        \u003cp style=\"margin: 0; max-width: 600px; font-size: 18px; line-height: 30px; color: #C9CCF2;\">它在你的项目里读文件、跑命令、记住你的习惯；要动重要的东西时，会停下来看着你，等你点头。\u003c/p>\n        \u003cdiv style=\"display: flex; align-items: center; gap: 12px; margin-top: 4px;\">\n          \u003ca href=\"#\" style=\"height: 48px; display: flex; align-items: center; padding: 0 24px; border-radius: 10px; background: #EFF0FB; color: #1B1838; text-decoration: none; font-size: 15px; font-weight: 600;\">下载 macOS 版\u003c/a>\n          \u003ca href=\"#\" style=\"height: 48px; display: flex; align-items: center; padding: 0 24px; border-radius: 10px; border: 1px solid rgba(239,240,251,0.28); color: #EFF0FB; text-decoration: none; font-size: 15px; font-weight: 500;\">GitHub\u003c/a>\n          \u003cspan style=\"font-size: 13px; color: #84839A; margin-left: 8px;\">适用于 Apple 芯片 · \u003cspan style=\"font-family: 'JetBrains Mono', monospace;\">[读音]\u003c/span> · [名字的来历]\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n  \u003c/div>\n\n  \u003cdiv style=\"margin-top: -200px; width: 1152px; height: 720px; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(27,24,56,0.1), 0 32px 80px rgba(27,24,56,0.35); flex-shrink: 0;\">\n    \u003cdiv style=\"width: 1440px; height: 900px; transform: scale(0.8); transform-origin: top left;\">\n      \u003cdc-import name=\"Screen\" mode=\"light\" hint-size=\"1440px,900px\">\u003c/dc-import>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv style=\"width: 1152px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: 80px;\">\n    \u003cdiv style=\"background: #FFFFFF; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px;\">\n      \u003cdc-import name=\"Pup\" animate=\"think\" cell=\"2.4\" hint-size=\"48px,48px\">\u003c/dc-import>\n      \u003cspan style=\"font-family: 'Noto Sans SC', sans-serif; font-size: 22px; font-weight: 900; color: #1B1838;\">在你的项目里干活\u003c/span>\n      \u003cspan style=\"font-size: 15px; line-height: 24px; color: #52515F;\">打开一个文件夹，它就在那里读、写、跑命令，用的是你本机的工具。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"background: #FFFFFF; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px;\">\n      \u003cdc-import name=\"Pup\" face=\"oh\" cell=\"2.4\" hint-size=\"48px,48px\">\u003c/dc-import>\n      \u003cspan style=\"font-family: 'Noto Sans SC', sans-serif; font-size: 22px; font-weight: 900; color: #1B1838;\">该问的时候会停\u003c/span>\n      \u003cspan style=\"font-size: 15px; line-height: 24px; color: #52515F;\">危险的命令、拿不准的选择，它会停下来看着你，等你批准或回答。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"background: #FFFFFF; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px;\">\n      \u003cdc-import name=\"Pup\" face=\"wink\" cell=\"2.4\" hint-size=\"48px,48px\">\u003c/dc-import>\n      \u003cspan style=\"font-family: 'Noto Sans SC', sans-serif; font-size: 22px; font-weight: 900; color: #1B1838;\">记得你\u003c/span>\n      \u003cspan style=\"font-size: 15px; line-height: 24px; color: #52515F;\">你的偏好和项目的约定会被记下来，下次不用再说一遍。你随时可以查看和删掉。\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":1560}}'>\nclass Component extends DCLogic {\n  renderVals() { return {}; }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Spread.dc.html":"\u003c!doctype html>\n\u003chtml lang=\"zh\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>传播\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Noto+Sans+SC:wght@700;900&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"width: 1440px; height: 1400px; box-sizing: border-box; padding: 64px 96px; background: #FFFFFF; color: #17161F; font-family: Inter, 'PingFang SC', sans-serif; display: flex; flex-direction: column; gap: 32px;\">\n\n  \u003cdiv style=\"display: flex; align-items: baseline; justify-content: space-between;\">\n    \u003ch2 style=\"margin: 0; font-family: 'Noto Sans SC', sans-serif; font-size: 40px; font-weight: 900; color: #1B1838;\">传播 · 小狼是主角\u003c/h2>\n    \u003cspan style=\"font-size: 14px; color: #52515F;\">产品里的克制规则在这里不适用：可以大、可以多、可以动。不变的只有轮廓、五种颜色和 20×20 网格。\u003c/span>\n  \u003c/div>\n\n  \u003cdiv style=\"height: 300px; border-radius: 16px; background: #1B1838; display: flex; align-items: center; gap: 48px; padding: 0 64px; flex-shrink: 0;\">\n    \u003cdc-import name=\"Pup\" animate=\"blink\" cell=\"11\" hint-size=\"220px,220px\">\u003c/dc-import>\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 14px;\">\n      \u003cspan style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 112px; line-height: 1; font-weight: 700; color: #EFF0FB; letter-spacing: -0.04em;\">ollupi\u003c/span>\n      \u003cspan style=\"font-family: 'Bricolage Grotesque', 'Noto Sans SC', sans-serif; font-size: 26px; line-height: 34px; font-weight: 600; color: #AEB5F5;\">一只住在你 Mac 里、会干活的像素小狼。\u003c/span>\n      \u003cdiv style=\"display: flex; gap: 8px; font-size: 13px;\">\n        \u003cspan style=\"height: 26px; display: flex; align-items: center; padding: 0 10px; border-radius: 13px; border: 1px solid rgba(239,240,251,0.24); color: #EFF0FB;\">macOS · Apple 芯片\u003c/span>\n        \u003cspan style=\"height: 26px; display: flex; align-items: center; padding: 0 10px; border-radius: 13px; border: 1px solid rgba(239,240,251,0.24); color: #EFF0FB; font-family: 'JetBrains Mono', monospace;\">[读音]\u003c/span>\n      \u003c/div>\n    \u003c/div>\n    \u003cspan style=\"margin-left: auto; align-self: flex-end; padding-bottom: 28px; font-size: 12px; color: #84839A;\">README 头图 · 1280×320\u003c/span>\n  \u003c/div>\n\n  \u003cdiv style=\"display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 16px; height: 400px;\">\n    \u003cdiv style=\"background: #F5F5F8; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between;\">\n      \u003cspan style=\"font-size: 13px; font-weight: 500; color: #52515F;\">头像 · GitHub / X / 即刻 / 小红书\u003c/span>\n      \u003cdiv style=\"display: flex; align-items: flex-end; gap: 20px;\">\n        \u003cdiv style=\"width: 180px; height: 180px; border-radius: 90px; background: #1B1838; display: flex; align-items: center; justify-content: center;\">\u003cdc-import name=\"Pup\" face=\"grin\" cell=\"6\" hint-size=\"120px,120px\">\u003c/dc-import>\u003c/div>\n        \u003cdiv style=\"width: 48px; height: 48px; border-radius: 24px; background: #1B1838; display: flex; align-items: center; justify-content: center;\">\u003cdc-import name=\"Pup\" face=\"grin\" cell=\"1.6\" hint-size=\"32px,32px\">\u003c/dc-import>\u003c/div>\n        \u003cdiv style=\"width: 32px; height: 32px; border-radius: 16px; background: #1B1838; display: flex; align-items: center; justify-content: center;\">\u003cdc-import name=\"Pup\" face=\"grin\" cell=\"1.1\" hint-size=\"22px,22px\">\u003c/dc-import>\u003c/div>\n      \u003c/div>\n      \u003cspan style=\"font-size: 12px; line-height: 18px; color: #737284;\">所有平台同一张：夜底咧嘴笑，和 App 图标一致。缩到 32px 还认得出，这是像素的好处。\u003c/span>\n    \u003c/div>\n\n    \u003cdiv style=\"background: #AEB5F5; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; color: #1B1838;\">\n      \u003cdiv style=\"display: flex; align-items: center; justify-content: space-between;\">\n        \u003cspan style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.03em;\">ollupi\u003c/span>\n        \u003cspan style=\"font-size: 12px; font-weight: 500;\">发版卡片\u003c/span>\n      \u003c/div>\n      \u003cdiv style=\"display: flex; align-items: flex-end; justify-content: space-between;\">\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px;\">\n          \u003cspan style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 88px; line-height: 0.9; font-weight: 800; letter-spacing: -0.04em;\">0.7.32\u003c/span>\n          \u003cspan style=\"font-family: 'Noto Sans SC', sans-serif; font-size: 18px; font-weight: 700;\">[这一版最重要的一件事]\u003c/span>\n        \u003c/div>\n        \u003cdc-import name=\"Pup\" face=\"wink\" cell=\"4.4\" hint-size=\"88px,88px\">\u003c/dc-import>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv style=\"border: 1px solid rgba(27,24,56,0.08); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px;\">\n      \u003cspan style=\"font-size: 13px; font-weight: 500; color: #52515F;\">招牌瞬间 · 一段 6 秒动图\u003c/span>\n      \u003cdiv style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; flex: 1;\">\n        \u003cdiv style=\"background: #F5F5F8; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;\">\n          \u003cdc-import name=\"Pup\" animate=\"think\" cell=\"4\" hint-size=\"80px,80px\">\u003c/dc-import>\n          \u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #52515F;\">reading src/…\u003c/span>\n          \u003cspan style=\"font-size: 13px; font-weight: 600; color: #1B1838;\">1 · 它在干活\u003c/span>\n        \u003c/div>\n        \u003cdiv style=\"background: #F5F5F8; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; box-shadow: inset 0 0 0 1px rgba(77,74,198,0.35);\">\n          \u003cdc-import name=\"Pup\" face=\"oh\" cell=\"4\" hint-size=\"80px,80px\">\u003c/dc-import>\n          \u003cspan style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9A5B00;\">rm -rf build/ ?\u003c/span>\n          \u003cspan style=\"font-size: 13px; font-weight: 600; color: #1B1838;\">2 · 停下来看着你\u003c/span>\n        \u003c/div>\n        \u003cdiv style=\"background: #F5F5F8; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;\">\n          \u003cdc-import name=\"Pup\" face=\"grin\" cell=\"4\" hint-size=\"80px,80px\">\u003c/dc-import>\n          \u003cspan style=\"font-size: 11px; color: #52515F;\">Allowed once\u003c/span>\n          \u003cspan style=\"font-size: 13px; font-weight: 600; color: #1B1838;\">3 · 你点头，它接着干\u003c/span>\n        \u003c/div>\n      \u003c/div>\n      \u003cspan style=\"font-size: 12px; line-height: 18px; color: #737284;\">把产品最核心的行为（会停下来请你批准）讲成一个三格故事。README 第一屏、推文、发布会都用它。\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv style=\"display: flex; flex-direction: column; gap: 14px;\">\n    \u003cdiv style=\"display: flex; justify-content: space-between; align-items: baseline;\">\n      \u003cspan style=\"font-size: 13px; font-weight: 500; color: #52515F;\">表情包 · 微信 / Slack / Discord\u003c/span>\n      \u003cspan style=\"font-size: 12px; color: #737284;\">受控扩展：新表情先在这里设计、加进集合，再拿去用。\"懂\"那张眨一只眼，是给传播新加的脸。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px;\">\n      \u003cdiv style=\"border: 3px solid #1B1838; border-radius: 20px; padding: 16px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 8px;\">\u003cdc-import name=\"Pup\" animate=\"think\" cell=\"5\" hint-size=\"100px,100px\">\u003c/dc-import>\u003cspan style=\"font-family: 'Noto Sans SC', sans-serif; font-size: 22px; font-weight: 900; color: #1B1838;\">在想了\u003c/span>\u003c/div>\n      \u003cdiv style=\"border: 3px solid #1B1838; border-radius: 20px; padding: 16px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 8px;\">\u003cdc-import name=\"Pup\" face=\"oh\" cell=\"5\" hint-size=\"100px,100px\">\u003c/dc-import>\u003cspan style=\"font-family: 'Noto Sans SC', sans-serif; font-size: 22px; font-weight: 900; color: #1B1838;\">等你点头\u003c/span>\u003c/div>\n      \u003cdiv style=\"border: 3px solid #1B1838; border-radius: 20px; padding: 16px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 8px;\">\u003cdc-import name=\"Pup\" face=\"grin\" cell=\"5\" hint-size=\"100px,100px\">\u003c/dc-import>\u003cspan style=\"font-family: 'Noto Sans SC', sans-serif; font-size: 22px; font-weight: 900; color: #1B1838;\">搞定\u003c/span>\u003c/div>\n      \u003cdiv style=\"border: 3px solid #1B1838; border-radius: 20px; padding: 16px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 8px;\">\u003cdc-import name=\"Pup\" face=\"wink\" cell=\"5\" hint-size=\"100px,100px\">\u003c/dc-import>\u003cspan style=\"font-family: 'Noto Sans SC', sans-serif; font-size: 22px; font-weight: 900; color: #1B1838;\">懂\u003c/span>\u003c/div>\n      \u003cdiv style=\"border: 3px solid #1B1838; border-radius: 20px; padding: 16px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 8px;\">\u003cdc-import name=\"Pup\" face=\"smile\" cell=\"5\" hint-size=\"100px,100px\">\u003c/dc-import>\u003cspan style=\"font-family: 'Noto Sans SC', sans-serif; font-size: 22px; font-weight: 900; color: #1B1838;\">早\u003c/span>\u003c/div>\n      \u003cdiv style=\"border: 3px solid #1B1838; border-radius: 20px; padding: 16px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 8px;\">\u003cdc-import name=\"Pup\" face=\"blink\" cell=\"5\" hint-size=\"100px,100px\">\u003c/dc-import>\u003cspan style=\"font-family: 'Noto Sans SC', sans-serif; font-size: 22px; font-weight: 900; color: #1B1838;\">嗯…\u003c/span>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; font-size: 13px; line-height: 22px; border-top: 1px solid rgba(27,24,56,0.08); padding-top: 20px;\">\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 4px;\">\n      \u003cspan style=\"font-weight: 600; color: #1B1838;\">传播时可以\u003c/span>\n      \u003cspan>· 大面积铺夜色或薰衣；小狼放到 200px 以上当主视觉。\u003c/span>\n      \u003cspan>· 加新表情和道具（节日、里程碑），但要先进表情集合，统一画。\u003c/span>\n      \u003cspan>· 每次发版配一张卡片、一帧小狼；动图按节拍硬切。\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 4px;\">\n      \u003cspan style=\"font-weight: 600; color: #C42F4A;\">任何场合都不可以\u003c/span>\n      \u003cspan>· 改轮廓比例，或画成非像素的写实狼、3D 狼。\u003c/span>\n      \u003cspan>· 用五种品牌色以外的颜色给小狼上色；放到渐变或彩虹底上。\u003c/span>\n      \u003cspan>· 用衬线字体做标题；用像素字体写字。\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":1400}}'>\nclass Component extends DCLogic {\n  renderVals() { return {}; }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Pup.dc.html":"\u003c!doctype html>\n\u003chtml lang=\"zh\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>像素小狼\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003cstyle>\nbody{margin:0}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv role=\"img\" aria-label=\"{{label}}\" style=\"width: {{px}}px; height: {{px}}px; display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); grid-template-rows: repeat(20, minmax(0, 1fr));\">\n\u003csc-for list=\"{{cells}}\" as=\"c\" hint-placeholder-count=\"400\">\u003cdiv style=\"background: {{c}}; box-shadow: 0 0 0 0.5px {{c}}\">\u003c/div>\u003c/sc-for>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"face\":{\"editor\":\"enum\",\"options\":[\"smile\",\"oh\",\"blink\",\"look-left\",\"look-right\",\"grin\",\"wink\"],\"default\":\"smile\"},\"cell\":{\"editor\":\"int\",\"min\":1,\"max\":24,\"default\":12},\"animate\":{\"editor\":\"enum\",\"options\":[\"none\",\"think\",\"blink\"],\"default\":\"none\"},\"$preview\":{\"width\":240,\"height\":240}}'>\nvar PUP_TOP = [\n  '...N............N...',\n  '..NLN..........NLN..',\n  '..NLLN........NLLN..',\n  '..NLPLN......NLPLN..',\n  '..NLPPLNNNNNNLPPLN..',\n  '.NLLPPLLLLLLLLPPLLN.',\n  '.NLLLLLLLSSLLLLLLLN.'\n];\nvar PUP_BOTTOM = [\n  '...NSSSSSSSSSSSSN...',\n  '....NNSSSSSSSSNN....',\n  '......NNSSSSNN......',\n  '........NNNN........',\n  '....................'\n];\nvar EYES = {\n  open: ['.NLLLWNLLSSLLWNLLLN.', 'NLLLLNNLSSSSLNNLLLLN', 'NLSSSNNSSSSSSNNSSSLN'],\n  closed: ['.NLLLLLLLSSLLLLLLLN.', 'NLLLLLLLSSSSLLLLLLLN', 'NLSSSNNSSSSSSNNSSSLN'],\n  left: ['.NLLWNLLLSSLWNLLLLN.', 'NLLLNNLLSSSSNNLLLLLN', 'NLSSNNSSSSSSNNSSSSLN'],\n  right: ['.NLLLLWNLSSLLLWNLLN.', 'NLLLLLNNSSSSLLNNLLLN', 'NLSSSSNNSSSSSSNNSSLN'],\n  wink: ['.NLLLWNLLSSLLLLLLLN.', 'NLLLLNNLSSSSLLLLLLLN', 'NLSSSNNSSSSSSNNSSSLN']\n};\nvar NOSE = ['NSPPSSSSNNNNSSSSPPSN', '.NSSSSSSSNNSSSSSSSN.'];\nvar MOUTH = {\n  smile: ['NSSSSSSSSSSSSSSSSSSN', '.NSSSSSNSNNSNSSSSSN.', '..NSSSSSNSSNSSSSSN..'],\n  oh: ['NSSSSSSSSSSSSSSSSSSN', '.NSSSSSSSNNSSSSSSSN.', '..NSSSSSNTTNSSSSSN..'],\n  grin: ['NSSSSSNSSSSSSNSSSSSN', '.NSSSSSNNNNNNSSSSSN.', '..NSSSSSNTTNSSSSSN..']\n};\nvar LAST = { oh: '...NSSSSNTTNSSSSN...', grin: '...NSSSSSNNSSSSSN...' };\nvar FACES = {\n  'smile': ['open', 'smile'],\n  'oh': ['open', 'oh'],\n  'blink': ['closed', 'smile'],\n  'look-left': ['left', 'smile'],\n  'look-right': ['right', 'smile'],\n  'grin': ['open', 'grin'],\n  'wink': ['wink', 'grin']\n};\nvar COLORS = { N: '#1B1838', L: '#AEB5F5', S: '#EFF0FB', P: '#F4AACB', T: '#EE6E8A', W: '#FFFFFF', '.': 'transparent' };\nvar LABELS = { 'smile': '小狼：微笑', 'oh': '小狼：看着你', 'blink': '小狼：眨眼', 'look-left': '小狼：向左看', 'look-right': '小狼：向右看', 'grin': '小狼：咧嘴笑', 'wink': '小狼：眨一只眼' };\nvar THINK = ['look-left', 'look-left', 'look-left', 'look-right', 'look-right', 'look-right', 'blink', 'look-left', 'look-left', 'look-right', 'look-right', 'look-right'];\nvar IDLE = ['smile', 'smile', 'smile', 'smile', 'smile', 'smile', 'smile', 'blink'];\n\nfunction grid(face) {\n  var f = FACES[face] || FACES.smile;\n  var rows = PUP_TOP.concat(EYES[f[0]], NOSE, MOUTH[f[1]]);\n  var bottom = PUP_BOTTOM.slice();\n  if (LAST[f[1]]) bottom[0] = LAST[f[1]];\n  return rows.concat(bottom);\n}\n\nclass Component extends DCLogic {\n  state = { tick: 0 };\n  componentDidMount() {\n    var self = this;\n    this.timer = setInterval(function () {\n      if ((self.props.animate || 'none') !== 'none') self.setState({ tick: self.state.tick + 1 });\n    }, 420);\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n  renderVals() {\n    var animate = this.props.animate || 'none';\n    var face = this.props.face || 'smile';\n    if (animate === 'think') face = THINK[this.state.tick % THINK.length];\n    if (animate === 'blink') face = IDLE[this.state.tick % IDLE.length];\n    var cell = parseFloat(this.props.cell) || 12;\n    var cells = [];\n    grid(face).forEach(function (row) {\n      for (var i = 0; i \u003c row.length; i++) cells.push(COLORS[r
